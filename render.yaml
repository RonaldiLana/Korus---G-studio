services:
  - type: web
    name: korus-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://api.korus.me
      - key: BACKEND_URL
        value: https://api.korus.me
